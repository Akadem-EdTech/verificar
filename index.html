<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de Certificado · AKADEM</title>
  <style>
    :root{ --orange:#E8490F; --navy:#2D3142; --light:#F8F7F4; }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--light);color:var(--navy);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(45,49,66,.12);
      max-width:480px;width:100%;overflow:hidden;}
    .head{background:var(--navy);color:#fff;padding:28px 32px;text-align:center;}
    .head .brand{font-size:26px;font-weight:800;letter-spacing:2px;}
    .head .brand span{color:var(--orange);}
    .head .sub{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:3px;margin-top:4px;}
    .body{padding:32px;}
    .status{display:flex;align-items:center;gap:12px;padding:16px;border-radius:10px;margin-bottom:24px;font-weight:600;}
    .ok{background:#e8f5e9;color:#2e7d32;}
    .bad{background:#ffebee;color:#c62828;}
    .pending{background:#fff8e1;color:#f57f17;}
    .status .icon{font-size:24px;}
    .row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee;font-size:14px;}
    .row .k{color:#888;}
    .row .v{font-weight:600;text-align:right;}
    .btn{display:block;width:100%;text-align:center;background:var(--orange);color:#fff;
      text-decoration:none;padding:14px;border-radius:10px;font-weight:700;margin-top:24px;transition:.2s;}
    .btn:hover{background:#c93c0a;}
    .code{font-family:monospace;font-size:12px;color:#999;text-align:center;margin-top:20px;word-break:break-all;}
    .foot{text-align:center;font-size:11px;color:#aaa;padding:16px;border-top:1px solid #f0f0f0;}
    .loader{text-align:center;padding:40px;color:#999;}
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="brand">AKADE<span>M</span></div>
      <div class="sub">Verificación de Certificado</div>
    </div>
    <div class="body" id="content">
      <div class="loader">Verificando…</div>
    </div>
    <div class="foot">AKADEM · OTEC acreditada SENCE · www.akadem.cl</div>
  </div>

<script>
  // >>> AJUSTA ESTO con la URL Web App del Apps Script (doGet) <<<
  const API_URL = "https://script.google.com/macros/s/AKfycbxevhW0vYA1I_ExBk_z3R_aaKmrJFlto_-6DEiE3mvYV9mONOd4sUcrbAhrPSN2uqIfyw/exec";

  const params = new URLSearchParams(location.search);
  const code = (params.get("id") || "").trim();
  const content = document.getElementById("content");

  function render(html){ content.innerHTML = html; }

  if(!code){
    render(`<div class="status bad"><span class="icon">✕</span> Código de verificación no proporcionado.</div>
            <p style="font-size:13px;color:#888;">Escanea el código QR del certificado para verificar su autenticidad.</p>`);
  } else if(API_URL.startsWith("PEGA_AQUI")){
    // Modo demo: sin backend configurado todavía
    render(`<div class="status pending"><span class="icon">⏳</span> Página de verificación en configuración.</div>
            <p style="font-size:13px;color:#888;">El código recibido es válido en formato, pero el índice de verificación aún no está conectado.</p>
            <div class="code">Código: ${code}</div>`);
  } else {
    fetch(API_URL + "?id=" + encodeURIComponent(code))
      .then(r => r.json())
      .then(j => {
        if(j.ok && j.data){
          const d = j.data;
          const pdfBtn = d.fileId
            ? `<a class="btn" href="https://drive.google.com/file/d/${d.fileId}/view" target="_blank">📄 Ver documento oficial</a>`
            : `<p style="font-size:12px;color:#f57f17;text-align:center;margin-top:16px;">Documento registrado. PDF en proceso de vinculación.</p>`;
          render(`
            <div class="status ok"><span class="icon">✓</span> Certificado auténtico y válido</div>
            <div class="row"><span class="k">Participante</span><span class="v">${d.alumno||'—'}</span></div>
            <div class="row"><span class="k">RUT</span><span class="v">${d.rut||'—'}</span></div>
            <div class="row"><span class="k">Curso</span><span class="v">${d.curso||'—'}</span></div>
            <div class="row"><span class="k">Tipo</span><span class="v" style="text-transform:capitalize">${d.tipo||'—'}</span></div>
            <div class="row"><span class="k">Emisión</span><span class="v">${d.fecha||'—'}</span></div>
            ${pdfBtn}
            <div class="code">${d.codigo}</div>`);
        } else {
          render(`<div class="status bad"><span class="icon">✕</span> Certificado no encontrado</div>
                  <p style="font-size:13px;color:#888;">El código no corresponde a ningún certificado emitido por AKADEM. Si crees que es un error, contáctanos a administracion@akadem.cl.</p>
                  <div class="code">Código consultado: ${code}</div>`);
        }
      })
      .catch(() => {
        render(`<div class="status bad"><span class="icon">✕</span> Error de conexión</div>
                <p style="font-size:13px;color:#888;">No se pudo consultar el índice de verificación. Intenta nuevamente.</p>`);
      });
  }
</script>
</body>
</html>
